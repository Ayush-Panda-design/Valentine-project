<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Floating background hearts -->
    <div id="background-hearts"></div>

    <!-- Main container -->
    <div class="container">
        <!-- Question section -->
        <div id="question-section">
            <h1>Will you be my Valentine? 💖</h1>
            
            <div class="button-container" id="button-container">
                <button class="yes-btn" onclick="handleYes()">Yes ❤️</button>
                <button class="no-btn" id="no-btn" onmouseover="moveNoButton()" onclick="moveNoButton()">No 💔</button>
            </div>
        </div>

        <!-- Celebration section - hidden initially -->
        <div class="celebration" id="celebration-section">
            <h2>Yay! Happy Valentine's Day! 💕🎉</h2>
            
            <div class="hearts-container">
                <div class="animated-heart">❤️</div>
                <div class="animated-heart">💕</div>
                <div class="animated-heart">💖</div>
                <div class="animated-heart">💗</div>
                <div class="animated-heart">💝</div>
            </div>

            <div class="valentine-image">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Large heart -->
                    <path d="M100,170 C20,120 10,80 10,60 C10,35 30,20 50,20 C70,20 85,30 100,50 C115,30 130,20 150,20 C170,20 190,35 190,60 C190,80 180,120 100,170 Z" fill="#ff1493" opacity="0.8"/>
                    
                    <!-- Medium heart -->
                    <path d="M100,130 C50,100 45,75 45,60 C45,45 55,35 67,35 C79,35 88,42 100,55 C112,42 121,35 133,35 C145,35 155,45 155,60 C155,75 150,100 100,130 Z" fill="#ff69b4"/>
                    
                    <!-- Small heart -->
                    <path d="M100,100 C70,80 67,65 67,55 C67,47 72,42 79,42 C86,42 92,46 100,55 C108,46 114,42 121,42 C128,42 133,47 133,55 C133,65 130,80 100,100 Z" fill="#ffb6c1"/>
                </svg>
            </div>

            <p style="font-size: 1.2em; color: #ff1493; margin-top: 20px;">
                You've made me the happiest! 🥰
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
